services:
  s3-mock:
    image: motoserver/moto:latest
    container_name: churn-s3-mock
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlops-pipeline:
    build: .
    container_name: churn-pipeline
    depends_on:
      s3-mock:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: http://s3-mock:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET_NAME: mlops-churn-data
    command: >
      sh -c "python src/ingest.py &&
             python src/train.py &&
             python src/predict.py"